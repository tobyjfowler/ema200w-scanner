name: Research study

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script under research/ to run"
        default: slope_study.py

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt tabulate
      - name: Run study
        run: python research/${{ inputs.script }} 2>&1 | tee research/last_run.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -f research/*.md research/history_*.csv research/last_run.log
          git diff --cached --quiet || git commit -m "research: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 15; done
