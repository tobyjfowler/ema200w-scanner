name: 200W EMA scan

on:
  schedule:
    # Weekdays 22:07 UTC (23:07 UK summer / 22:07 UK winter), ~2h after the US close.
    - cron: "7 22 * * 1-5"
  workflow_dispatch:
    inputs:
      always_push:
        description: "Send Telegram even if there are no new signals"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan all universes and build dashboard data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # Friday (5) always sends the weekly summary; other days only on new signals.
          set -o pipefail
          if [ "${{ inputs.always_push }}" = "true" ] || [ "$(date -u +%u)" = "5" ]; then
            python build_dashboard.py --push --always-push 2>&1 | tee data/last_run.log
          else
            python build_dashboard.py --push 2>&1 | tee data/last_run.log
          fi

      - name: Commit updated data (and the run log)
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -f data/last_run.log
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m "data: scan $(date -u +%Y-%m-%d)"
          git push

      - name: Prepare site
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/latest.json data/history.json site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
